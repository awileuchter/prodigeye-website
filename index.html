<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProdigEye — Under Construction</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eef5ff 0%, #f8fafc 100%);
      color: #0b4cc9;
      padding: 24px;
    }

    .panel {
      width: min(520px, 100%);
      padding: 32px;
      border-radius: 28px;
      background: white;
      box-shadow: 0 24px 80px rgba(11, 76, 201, 0.12);
      text-align: center;
    }

    .panel h1 {
      font-size: clamp(2rem, 3vw, 3rem);
      margin-bottom: 0.5rem;
    }

    .panel p {
      margin-bottom: 24px;
      color: #30416c;
      line-height: 1.6;
    }

    .field {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
      text-align: left;
    }

    label {
      font-weight: 600;
      color: #102748;
      font-size: 0.98rem;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(11, 76, 201, 0.18);
      border-radius: 14px;
      font-size: 1rem;
      transition: border-color 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: #0b4cc9;
      box-shadow: 0 0 0 4px rgba(11, 76, 201, 0.1);
    }

    button {
      width: 100%;
      padding: 14px 18px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #0b4cc9 0%, #00d9ff 100%);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(11, 76, 201, 0.18);
    }

    .message {
      min-height: 1.4rem;
      color: #d0393e;
      font-size: 0.95rem;
      margin-top: 12px;
    }

    .note {
      margin-top: 12px;
      color: #5c6f91;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main class="panel" role="main">
    <h1>ProdigEye is under construction</h1>
    <p>Enter the access password to continue to the main site.</p>

    <form id="auth-form" autocomplete="off">
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="off" required placeholder="Enter password" />
      </div>
      <button type="submit">Continue</button>
      <div id="message" class="message" aria-live="polite"></div>
    </form>

    <p class="note">Only the correct password will redirect to <code>main.html</code>.</p>
  </main>

  <script>
    const PASSWORD = 'awiawi';
    const form = document.getElementById('auth-form');
    const passwordInput = document.getElementById('password');
    const message = document.getElementById('message');

    function redirectToMain() {
      window.location.href = 'main.html';
    }

    function showError(text) {
      message.textContent = text;
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const value = passwordInput.value.trim();

      if (value === PASSWORD) {
        redirectToMain();
        return;
      }

      showError('Incorrect password. Please try again.');
      passwordInput.value = '';
      passwordInput.focus();
    });
  </script>
</body>
</html>
