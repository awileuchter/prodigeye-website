<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProdigEye – Under Construction</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0b4cc9, #1a1f3c);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }

    .wrapper {
      animation: fadeIn 1.2s ease;
      padding: 20px;
    }

    img {
      width: 180px;
      height: auto;
      margin-bottom: 30px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }

    h1 {
      font-size: 48px;
      margin-bottom: 15px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    }

    p {
      font-size: 22px;
      opacity: 0.9;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <img src="prodigeye.png" alt="ProdigEye Logo">
    <h1>UNDER CONSTRUCTION</h1>
    <p>Our new website is on the way.</p>
  </div>
</body>
</html>
